plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.upe78.ars'
    compileSdk 35
    defaultConfig {
        applicationId "com.upe78.ars"
        minSdk 26
        targetSdk 34
        versionCode 3          // bump +1 every build so updates install in place
        versionName "5.0.2"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // debug-key-signed release: installable, no secrets needed
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    lint { abortOnError false }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'   // ComponentActivity + ActivityResult API
    implementation 'androidx.webkit:webkit:1.10.0'   // WebViewAssetLoader: secure-origin serving
}
